# Optional example for a VPS with Nginx and PHP-FPM. On Apache or cPanel the bundled public/.htaccess does the same job: point the domain's
# document root at the `public` folder (never at the project folder).
server {
    listen 80;
    server_name sas.example.org www.sas.example.org;   # your domain; add HTTPS with Let's Encrypt (certbot --nginx)
    root /var/www/sas/public;
    index index.php;
    client_max_body_size 25m;                          # a little above SAS_UPLOAD_MAX_KB

    # one address for each page: strip a trailing slash
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;    # your PHP-FPM socket
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # never serve hidden files (.env, .git) or private storage
    location ~ /\.(?!well-known) { deny all; }
}
