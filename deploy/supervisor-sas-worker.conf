; Optional. Only for a server where you can run background programs (a VPS). On simple hosting leave this out and keep SAS_QUEUE_VIA_CRON=true:
; the cron line then sends the queued emails once a minute.
; Install: copy to /etc/supervisor/conf.d/sas-worker.conf, fix the paths and user, then `supervisorctl reread && supervisorctl update`.
; Set SAS_QUEUE_VIA_CRON=false in .env when you use it. After every release run `php artisan queue:restart`.
[program:sas-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/sas/artisan queue:work --queue=default,mail,reminders,scanning --tries=5 --backoff=60 --max-time=3600
directory=/var/www/sas
user=www-data
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/sas/storage/logs/worker.log
