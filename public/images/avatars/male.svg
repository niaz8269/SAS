<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Sketch of a smiling young man">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#d9e5f7"/></linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c4a98"/><stop offset="1" stop-color="#123a7a"/></linearGradient>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- shoulders, jacket, shirt and tie -->
    <path d="M14 204c4-38 30-56 70-62l16 20 16-20c40 6 66 24 70 62z" fill="url(#suit)" stroke="#0d2c5c" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M84 142l16 30 16-30-8-4-8 12-8-12z" fill="#fff" stroke="#0d2c5c" stroke-width="2" stroke-linejoin="round"/>
    <path d="M96 156h8l4 28-8 8-8-8z" fill="#c9a24a" stroke="#8a6a1c" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M84 142l-14 14 12 30M116 142l14 14-12 30" fill="none" stroke="#0d2c5c" stroke-width="2" stroke-linecap="round"/>
    <!-- neck -->
    <path d="M87 112v32c4 8 22 8 26 0v-32z" fill="#fbf3ea" stroke="#0d2c5c" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- ears -->
    <path d="M69 90c-6-2-9 4-7 11s6 9 9 6z" fill="#fbf3ea" stroke="#0d2c5c" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M131 90c6-2 9 4 7 11s-6 9-9 6z" fill="#fbf3ea" stroke="#0d2c5c" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- face with a defined jaw -->
    <path d="M69 84c0-26 13-38 31-38s31 12 31 38c0 12-2 22-8 31-6 9-14 14-23 14s-17-5-23-14c-6-9-8-19-8-31z" fill="#fbf3ea" stroke="#0d2c5c" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- swept hair -->
    <path d="M66 86c-5-30 8-50 36-52 24-2 40 14 34 50-2-12-6-20-14-25-14 6-30 6-44-1-7 6-10 16-12 28z" fill="#1d2f52" stroke="#0d2c5c" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M82 50c10-8 26-10 40-2" fill="none" stroke="#5d79ad" stroke-width="2.5" stroke-linecap="round"/>
    <!-- brows, eyes, nose, smile -->
    <path d="M80 80q9-6 18-1M102 79q9-5 18 1" fill="none" stroke="#1d2f52" stroke-width="3.2" stroke-linecap="round"/>
    <ellipse cx="89" cy="91" rx="4.2" ry="3.4" fill="#fff" stroke="#0d2c5c" stroke-width="1.6"/><circle cx="89.4" cy="91" r="2.4" fill="#1d2f52"/><circle cx="90.2" cy="90.2" r=".8" fill="#fff"/>
    <ellipse cx="111" cy="91" rx="4.2" ry="3.4" fill="#fff" stroke="#0d2c5c" stroke-width="1.6"/><circle cx="111.4" cy="91" r="2.4" fill="#1d2f52"/><circle cx="112.2" cy="90.2" r=".8" fill="#fff"/>
    <path d="M100 92c-1 6-3 11-5 14 3 3 8 3 10 0" fill="none" stroke="#0d2c5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M88 113q12 10 24 0" fill="#fff" stroke="#0d2c5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M91 114q9 5 18 0" fill="none" stroke="#0d2c5c" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M78 108q2 12 8 17M122 108q-2 12-8 17" fill="none" stroke="#9fb4d9" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <circle cx="100" cy="100" r="99" fill="none" stroke="#c9d6ee" stroke-width="2"/>
</svg>